version: '3.7'

services:
  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - "./prometheus.docker.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    restart: always
